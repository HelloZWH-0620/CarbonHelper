<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>碳小绒 · 纯黑毛绒升级版</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 20%, #f0f7f2, #cbe3d3 60%, #93c4a6 100%);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .stage {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .pet-area {
    position: relative;
    width: 300px;
    height: 300px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* 对话气泡 */
  .bubble {
    position: absolute;
    left: 50%;
    bottom: 100%;
    width: max-content;
    max-width: 240px;
    padding: 10px 16px;
    background: #fff;
    color: #1a2b22;
    font-size: 14px;
    line-height: 1.5;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, 10px);
    transition: all 0.25s ease;
    z-index: 30;
  }
  .bubble.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }
  .bubble::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 100%;
    margin-left: -8px;
    border: 8px solid transparent;
    border-top-color: #fff;
  }
  /* Canvas 画毛 */
  #fuzzCanvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 300px;
    height: 300px;
    z-index: 5;
    pointer-events: none;
  }
  /* 容器和手脚的SVG毛绒滤镜 */
  .fluffy {
    filter: url(#fuzzFilter);
  }
  .pet-wrapper {
    position: relative;
    width: 260px;
    height: 260px;
    cursor: pointer;
    z-index: 10;
    transition: transform 0.1s ease-out;
  }
  /* 脸 */
  .face {
    position: absolute;
    inset: 0;
    z-index: 6;
  }
  .eye {
    position: absolute;
    top: 100px;
    width: 36px;
    height: 44px;
    border-radius: 50%;
    background: #fff;
    box-shadow: inset 0 -4px 8px rgba(0,0,0,0.1);
    overflow: hidden;
    transition: transform 0.1s ease;
  }
  .eye.left { left: 70px; }
  .eye.right { right: 70px; }
  .eye.blink { transform: scaleY(0.05); }
  .pupil {
    position: absolute;
    top: 10px;
    left: 8px;
    width: 22px;
    height: 26px;
    border-radius: 50%;
    background: #111;
    transition: transform 0.15s ease-out;
  }
  .glint {
    position: absolute;
    top: 6px;
    left: 6px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #fff;
  }
  .cheek {
    position: absolute;
    top: 140px;
    width: 30px;
    height: 18px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 140, 150, 0.6), transparent 70%);
  }
  .cheek.left { left: 45px; }
  .cheek.right { right: 45px; }
  /* 嘴巴（加大加亮，以免在黑毛中看不见） */
  .mouth {
    position: absolute;
    left: 50%;
    top: 152px;
    width: 18px;
    height: 10px;
    margin-left: -9px;
    border-bottom: 3px solid #e0e0e0; /* 浅色线条，在黑毛上才明显 */
    border-radius: 0 0 50% 50%;
    z-index: 10;
  }
  .mouth::before, .mouth::after {
    content: '';
    position: absolute;
    top: 0;
    width: 9px;
    height: 7px;
    border-bottom: 3px solid #e0e0e0;
    border-radius: 0 0 50% 50%;
  }
  .mouth::before { left: -8px; transform: rotate(-15deg); }
  .mouth::after { right: -8px; transform: rotate(15deg); }
  /* 头顶绿芽 */
  .sprout {
    position: absolute;
    top: -8px;
    left: 50%;
    margin-left: -10px;
    width: 20px;
    height: 30px;
    z-index: 4;
    filter: url(#fuzzFilter);
  }
  .sprout .stem {
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 4px;
    height: 20px;
    background: #4a9e59;
    margin-left: -2px;
    border-radius: 4px;
  }
  .sprout .leaf {
    position: absolute;
    top: 0;
    width: 16px;
    height: 12px;
    background: #6ecb76;
    border-radius: 50% 50% 50% 0;
    box-shadow: inset -2px 2px 4px rgba(0,0,0,0.1);
  }
  .sprout .leaf.left  { left: 0; transform: rotate(-30deg); border-radius: 50% 0 50% 50%; }
  .sprout .leaf.right { right: 0; transform: rotate(30deg); }
  /* 头顶水珠 */
  .water-drop {
    position: absolute;
    top: -6px;
    right: 50px;
    width: 18px;
    height: 24px;
    background: rgba(180, 230, 255, 0.75);
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    box-shadow: inset -2px -2px 4px rgba(255,255,255,0.8), 0 4px 10px rgba(0,0,0,0.1);
    z-index: 7;
    animation: drip 3s infinite ease-in-out;
  }
  .water-drop::after {
    content: '';
    position: absolute;
    bottom: 4px;
    right: 4px;
    width: 6px;
    height: 6px;
    background: #fff;
    border-radius: 50%;
    opacity: 0.8;
  }
  @keyframes drip {
    0%, 100% { transform: rotate(-45deg) scale(1); }
    50% { transform: rotate(-45deg) scale(1.1) translateY(2px); }
  }
  /* 手脚（加宽了，变成宽宽的小短手） */
  .limb {
    position: absolute;
    border-radius: 999px;
    background: linear-gradient(180deg, #2b2b2b, #111);
    z-index: 2;
    box-shadow: inset -1px 0 2px rgba(0,0,0,0.5);
  }
  /* 手臂：从 8px 加宽到 18px */
  .arm {
    top: 125px;
    width: 18px;
    height: 55px;
    transform-origin: top center;
  }
  .arm.left  { left: 22px; transform: rotate(35deg); }
  .arm.right { right: 22px; transform: rotate(-35deg); }
  .arm.right.waving { animation: wave 0.6s ease-in-out 3; }
  @keyframes wave {
    0%, 100% { transform: rotate(-35deg); }
    20%      { transform: rotate(-85deg); }
    50%      { transform: rotate(-15deg); }
    80%      { transform: rotate(-75deg); }
  }
  /* 腿：从 10px 加宽到 22px */
  .leg {
    top: 185px;
    width: 22px;
    height: 45px;
    background: linear-gradient(180deg, #1a1a1a, #000);
  }
  .leg.left  { left: 75px; }
  .leg.right { right: 75px; }
  /* 黑色小鞋子（也加宽了） */
  .shoe {
    position: absolute;
    left: 50%;
    bottom: -12px;
    width: 40px;
    height: 22px;
    margin-left: -20px;
    background: linear-gradient(180deg, #2b2b2b, #000);
    border-radius: 20px 20px 8px 8px;
    box-shadow: inset 0 2px 4px rgba(255,255,255,0.1), 0 4px 8px rgba(0,0,0,0.3);
  }
  .shoe::after {
    content: '';
    position: absolute;
    bottom: -4px;
    left: 2px;
    right: 2px;
    height: 6px;
    background: #333;
    border-radius: 0 0 8px 8px;
  }
  /* 影子 */
  .shadow {
    position: absolute;
    bottom: 25px;
    left: 50%;
    width: 120px;
    height: 20px;
    margin-left: -60px;
    background: radial-gradient(ellipse, rgba(0,0,0,0.3), transparent 70%);
    border-radius: 50%;
    z-index: 1;
    animation: shadowPulse 3s infinite ease-in-out;
  }
  @keyframes shadowPulse {
    0%, 100% { transform: scale(1); opacity: 0.8; }
    50% { transform: scale(0.85); opacity: 0.5; }
  }
  /* 提示 */
  .hint {
    margin-top: 20px;
    color: #4a6b57;
    font-size: 13px;
    letter-spacing: 2px;
    z-index: 10;
  }
</style>
</head>
<body>
<!-- 隐藏的SVG滤镜，让手脚边缘有毛绒感 -->
<svg width="0" height="0" style="position:absolute;">
  <defs>
    <filter id="fuzzFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
</svg>
<div class="stage">
  <div class="pet-area">
    <div class="bubble" id="bubble">你好呀～我是碳小绒！</div>
    <canvas id="fuzzCanvas" width="300" height="300"></canvas>
    <div class="pet-wrapper" id="petWrapper">
      <div class="shadow"></div>
      <div class="sprout fluffy">
        <div class="stem"></div>
        <div class="leaf left"></div>
        <div class="leaf right"></div>
      </div>
      <div class="water-drop"></div>
      <!-- 宽宽的小短手和小短腿 -->
      <div class="limb arm left fluffy"></div>
      <div class="limb arm right fluffy" id="armRight"></div>
      <div class="limb leg left fluffy"><div class="shoe fluffy"></div></div>
      <div class="limb leg right fluffy"><div class="shoe fluffy"></div></div>
      <div class="face">
        <div class="eye left"><div class="pupil"><div class="glint"></div></div></div>
        <div class="eye right"><div class="pupil"><div class="glint"></div></div></div>
        <div class="cheek left"></div>
        <div class="cheek right"></div>
        <!-- 嘴巴在这里 -->
        <div class="mouth"></div>
      </div>
    </div>
  </div>
  <div class="hint">移动鼠标 · 小煤球会看着你 · 点一下它会跳</div>
</div>
<script>
  // ================= 1. Canvas 绘制毛绒效果 =================
  const canvas = document.getElementById('fuzzCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;
  const centerX = W / 2;
  const centerY = H / 2 + 10;
  const radius = 82;
  function drawFuzz() {
    ctx.clearRect(0, 0, W, H);
    // 1. 画深色底圆
    ctx.beginPath();
    ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
    ctx.fillStyle = '#0d0d12';
    ctx.fill();
    // 2. 内部毛发（让里面也“忙碌”）
    const innerHairCount = 1500;
    for (let i = 0; i < innerHairCount; i++) {
      const angle = Math.random() * Math.PI * 2;
      const r = Math.random() * (radius - 10);
      const x = centerX + Math.cos(angle) * r;
      const y = centerY + Math.sin(angle) * r;
      const len = 2 + Math.random() * 4;
      const dir = Math.random() * Math.PI * 2;
      ctx.strokeStyle = `rgb(${20 + Math.random()*30}, ${20 + Math.random()*30}, ${30 
+ Math.random()*40})`;
      ctx.lineWidth = 0.6 + Math.random() * 0.8;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + Math.cos(dir) * len, y + Math.sin(dir) * len);
      ctx.stroke();
    }
    // 3. 外轮廓毛发（向外炸开）
    const outerHairCount = 3000;
    for (let i = 0; i < outerHairCount; i++) {
      const angle = Math.random() * Math.PI * 2;
      const startR = radius - 5 + Math.random() * 15;
      const startX = centerX + Math.cos(angle) * startR;
      const startY = centerY + Math.sin(angle) * startR;
      const length = 3 + Math.random() * 10;
      const endX = centerX + Math.cos(angle) * (startR + length);
      const endY = centerY + Math.sin(angle) * (startR + length);
      const gray = 10 + Math.floor(Math.random() * 40);
      const blue = 15 + Math.floor(Math.random() * 30);
      ctx.strokeStyle = `rgb(${gray}, ${gray}, ${blue})`;
      ctx.lineWidth = 0.8 + Math.random() * 1.2;
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.lineTo(endX, endY);
      ctx.stroke();
    }
  }
  drawFuzz();
  // ================= 2. 交互逻辑 =================
  const petWrapper = document.getElementById('petWrapper');
  const bubbleEl = document.getElementById('bubble');
  const armRight = document.getElementById('armRight');
  const pupils = document.querySelectorAll('.pupil');
  const eyeEls = document.querySelectorAll('.eye');
  let targetX = 0, targetY = 0;
  let curX = 0, curY = 0;
  document.addEventListener('mousemove', (e) => {
    const rect = petWrapper.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    targetX = Math.max(-1, Math.min(1, (e.clientX - cx) / 250));
    targetY = Math.max(-1, Math.min(1, (e.clientY - cy) / 250));
  });
  document.addEventListener('mouseleave', () => {
    targetX = 0;
    targetY = 0;
  });
  function raf() {
    curX += (targetX - curX) * 0.08;
    curY += (targetY - curY) * 0.08;
    petWrapper.style.transform = `translate(${curX * 10}px, ${curY * 8}px) rotate(${curX * 5}deg)`;
    pupils.forEach(p => {
      p.style.transform = `translate(${curX * 6}px, ${curY * 6}px)`;
    });
    requestAnimationFrame(raf);
  }
  raf();
  function blink() {
    eyeEls.forEach(e => e.classList.add('blink'));
    setTimeout(() => eyeEls.forEach(e => e.classList.remove('blink')), 150);
  }
  setInterval(() => {
    if (Math.random() > 0.5) blink();
  }, 3000);
  const LINES = [
    '我是碳小绒，专门帮你减碳～',
    '少开一天车，等于种下一棵树 
🌳
',
    '空调调高 1℃，地球凉快一点点 
☀️
',
    '随手关灯，我就会偷偷开心 
✨
',
    '自带水杯，就少一个塑料瓶 
💧
',
    '我头顶的水珠，是帮你攒的低碳能量哦',
    '今天走路了吗？我陪你一起 
🚶
',
    '省下的每一度电，都是我的小零食 
⚡
',
    '垃圾分类，我有在认真看哦 
👀
',
    '谢谢你陪我，地球也谢谢你 
🌍
'
  ];
  let bubbleTimer = null;
  function say(text) {
    bubbleEl.textContent = text;
    bubbleEl.classList.add('show');
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(() => bubbleEl.classList.remove('show'), 2800);
  }
  petWrapper.addEventListener('click', (e) => {
    petWrapper.style.transition = 'transform 0.1s';
    petWrapper.style.transform = `scale(1.1, 0.9) translateY(-10px)`;
    setTimeout(() => {
      petWrapper.style.transform = `scale(1, 1) translateY(0)`;
    }, 150);
    
    armRight.classList.add('waving');
    setTimeout(() => armRight.classList.remove('waving'), 1800);
    say(LINES[Math.floor(Math.random() * LINES.length)]);
    
    const drop = document.querySelector('.water-drop');
    drop.style.animation = 'none';
    drop.offsetHeight; 
    drop.style.animation = 'drip 0.6s ease-in-out 3';
  });
  setTimeout(() => say('你好呀！我是碳小绒 
🌱
'), 800);
</script>
</body>
</html>
