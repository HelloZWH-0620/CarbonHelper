plugins {
    id 'com.android.application'
}

android {
    namespace 'com.carbonhelper.tankan'
    compileSdk 36

    defaultConfig {
        applicationId "com.carbonhelper.tankan"
        minSdk 31
        targetSdk 36
        versionCode 3
        versionName "0.0.3"
    }

    signingConfigs {
        release {
            storeFile file('../keystore/tankan.jks')
            storePassword 'tankan123'
            keyAlias 'tankan'
            keyPassword 'tankan123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
